<!DOCTYPE html>
<!-- links.html v3 · 2026-08-01 · static og:image for text previews, richer specs, wl param removed (wells.html self-fetches) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Property Details</title>
<meta property="og:title" content="Lance the Realtor — Property Details">
<meta property="og:description" content="Tap for photos, pricing, directions, and parcel info.">
<meta property="og:image" content="https://lancea141-source.github.io/utah-parcel-lookup/brand-preview.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F4EDE4; min-height: 100vh; }
  .wrap { max-width: 430px; margin: 0 auto; }
  h1 { font-size: 19px; color: #F4EDE4; font-weight: 700; line-height: 1.3; }
  .sub  { font-size: 13px; color: #C2A178; margin-top: 3px; }
  .sub2 { font-size: 12px; color: #C2A178; margin-top: 6px; opacity: .9; }
  #hero { width: 100%; max-height: 210px; object-fit: cover; display: block; }

  #pricebar {
    background: #C0652A; color: #F4EDE4; padding: 12px 16px;
    font-size: 1.25em; font-weight: 700; display: none;
    align-items: center; justify-content: space-between;
  }
  #pricebar .status {
    font-size: 0.55em; font-weight: normal;
    background: rgba(244,237,228,.2); padding: 3px 10px; border-radius: 10px;
  }

  #specs { display: none; grid-template-columns: 1fr 1fr; gap: 1px; background: #ddd; }
  .spec { background: #fff; padding: 10px 14px; }
  .spec b { display: block; font-size: 0.68em; color: #C0652A; text-transform: uppercase; letter-spacing: .03em; }
  .spec span { font-size: 1em; color: #2F3E46; }

  main { padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  a.btn {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid #d8cfc0; border-radius: 14px;
    padding: 15px 16px; text-decoration: none; color: #2F3E46;
    -webkit-tap-highlight-color: rgba(192,101,42,.2);
  }
  a.btn:active { background: #f7f1e6; }
  a.btn .ic { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
  a.btn .t  { font-size: 15px; font-weight: 600; }
  a.btn .d  { font-size: 12px; color: #8a7d6a; margin-top: 1px; }
  a.btn .arrow { margin-left: auto; color: #8a7d6a; font-size: 14px; }
  a.btn.small { flex-direction: column; gap: 6px; text-align: center; padding: 14px 8px; }
  a.btn.small .arrow { display: none; }
  a.btn.hero { background: #C0652A; border-color: #C0652A; }
  a.btn.hero .t, a.btn.hero .ic, a.btn.hero .arrow { color: #F4EDE4; }
  a.btn.hero .d { color: #F4EDE4; opacity: .85; }
  a.btn.contact { background: #2F3E46; border-color: #2F3E46; }
  a.btn.contact .t, a.btn.contact .ic { color: #F4EDE4; }
  footer { text-align: center; font-size: 11px; color: #8a7d6a; padding: 4px 0 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex; align-items:center; gap:12px; padding:12px 16px; background:#31414F;">
    <img src="logo.png" alt="Lance the Realtor" style="height:74px; flex-shrink:0;" onerror="this.style.display='none'">
    <div style="min-width:0;">
      <h1 id="h-addr">Property</h1>
      <div class="sub" id="h-sub"></div>
      <div class="sub2" id="h-sub2"></div>
    </div>
  </header>
  <img id="hero" alt="" style="display:none">
  <div id="pricebar"><span id="price-txt"></span><span class="status" id="status-txt"></span></div>
  <div id="specs"></div>
  <main id="buttons"></main>
  <footer>Lance Anderson · Equity Real Estate · <span style="opacity:.7">links v3</span></footer>
</div>

<script>
const P = new URLSearchParams(location.search);
const g = k => (P.get(k) || '').trim();

const addr    = g('addr');
const city    = g('city');
const county  = g('county');
const parcel  = g('parcel');
const mls     = g('mls');
const acres   = g('acres');
const lat     = g('lat');
const lng     = g('lng');
const rec     = g('rec');
const img     = g('img');
const isLand  = g('isLand') === '1';
const price   = g('price');
const status  = g('status');
const dom     = g('dom');
const zoning  = g('zoning');
const water   = g('water');
const utilities = g('utilities');
const beds    = g('beds');
const baths   = g('baths');
const sqft    = g('sqft');
const yearBuilt = g('yearBuilt');
const garage  = g('garage');
const hoa     = g('hoa');
const ppsf    = g('ppsf');

const PHONE_TEL = '8018605225';
const PHONE_FMT = '(801) 860-5225';

const esc = s => (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.title = (addr || 'Property') + (price ? ' — $' + Number(price).toLocaleString() : '');
document.getElementById('h-addr').textContent = addr || (acres ? acres + ' acres' : 'Property');
const subParts = [];
if (city)   subParts.push(city + ', UT');
if (acres)  subParts.push(acres + (parseFloat(acres) === 1 ? ' acre' : ' acres'));
if (county) subParts.push(county + ' County');
document.getElementById('h-sub').textContent = subParts.join(' · ');
const sub2Parts = [];
if (parcel) sub2Parts.push('Parcel ' + parcel);
if (mls)    sub2Parts.push('MLS ' + mls);
document.getElementById('h-sub2').textContent = sub2Parts.join(' · ');

if (img) {
  const hero = document.getElementById('hero');
  hero.src = img;
  hero.style.display = 'block';
  hero.onerror = () => { hero.style.display = 'none'; };
}

// ── Price / status banner ─────────────────────────────────────
if (price) {
  document.getElementById('price-txt').textContent = '$' + Number(price).toLocaleString();
  const statusEl = document.getElementById('status-txt');
  statusEl.textContent = [status, dom ? 'DOM ' + dom : ''].filter(Boolean).join(' · ');
  document.getElementById('pricebar').style.display = 'flex';
}

// ── Spec grid ──────────────────────────────────────────────────
const specRows = [];
if (isLand) {
  if (acres)     specRows.push(['Acres', acres]);
  if (zoning)    specRows.push(['Zoning', zoning]);
  if (county)    specRows.push(['County', county]);
  if (water)     specRows.push(['Water', water]);
  if (utilities) specRows.push(['Utilities', utilities]);
} else {
  if (beds)      specRows.push(['Beds', beds]);
  if (baths)     specRows.push(['Baths', baths]);
  if (sqft)      specRows.push(['Sq Ft', sqft]);
  if (yearBuilt) specRows.push(['Year Built', yearBuilt]);
  if (garage)    specRows.push(['Garage', garage]);
  if (ppsf)      specRows.push(['$/Sqft', '$' + ppsf]);
  if (dom)       specRows.push(['DOM', dom]);
  if (hoa)       specRows.push(['HOA', hoa]);
}
if (specRows.length) {
  document.getElementById('specs').innerHTML = specRows.map(r =>
    '<div class="spec"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div>').join('');
  document.getElementById('specs').style.display = 'grid';
}

// ── Action buttons ─────────────────────────────────────────────
const gps  = (lat && lng) ? lat + ',' + lng : '';
const BASE = 'https://lancea141-source.github.io/utah-parcel-lookup/';
const btns = [];

if (gps || (addr && city)) {
  const q = gps || encodeURIComponent(addr + ', ' + city + ', UT');
  btns.push({ small: true, ic: '🗺', t: 'Google Maps',
    url: 'https://www.google.com/maps/search/?api=1&query=' + q });
  btns.push({ small: true, ic: '🍎', t: 'Apple Maps',
    url: gps ? 'https://maps.apple.com/?ll=' + gps + '&q=Property'
             : 'https://maps.apple.com/?q=' + encodeURIComponent(addr + ', ' + city + ', UT') });
}

if (parcel && county && gps) {
  btns.push({ hero: true, ic: '📐', t: 'Walk the boundary', d: 'Live GPS on the parcel lines',
    url: BASE + 'boundary.html?parcel=' + encodeURIComponent(parcel) +
         '&county=' + encodeURIComponent(county) + '&lat=' + lat + '&lng=' + lng });
}

if (rec) {
  btns.push({ ic: '🏛', t: 'County records', d: 'Verify parcel at ' + (county || 'the') + ' County',
    url: rec, ext: true });
}

if (parcel && county && gps) {
  btns.push({ ic: '💧', t: 'Nearby wells', d: 'Well logs within 2 miles',
    url: BASE + 'wells.html?parcel=' + encodeURIComponent(parcel) +
         '&county=' + encodeURIComponent(county) + '&lat=' + lat + '&lng=' + lng });
}

if (mls) {
  btns.push({ ic: '🏡', t: 'MLS listing', d: 'Photos, price, full details',
    url: 'https://www.utahrealestate.com/' + encodeURIComponent(mls), ext: true });
}

let html = '';
let i = 0;
while (i < btns.length) {
  const b = btns[i];
  if (b.small && btns[i+1] && btns[i+1].small) {
    html += '<div class="row2">' +
      [b, btns[i+1]].map(x =>
        '<a class="btn small" href="' + esc(x.url) + '"><span class="ic">' + x.ic +
        '</span><span class="t">' + esc(x.t) + '</span></a>').join('') + '</div>';
    i += 2;
    continue;
  }
  html += '<a class="btn' + (b.hero ? ' hero' : '') + '" href="' + esc(b.url) + '"' +
    (b.ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' +
    '<span class="ic">' + b.ic + '</span><span><span class="t">' + esc(b.t) + '</span>' +
    (b.d ? '<div class="d">' + esc(b.d) + '</div>' : '') + '</span>' +
    '<span class="arrow">' + (b.ext ? '↗' : '›') + '</span></a>';
  i++;
}

html += '<div class="row2" style="margin-top:6px;">' +
  '<a class="btn small contact" href="tel:' + PHONE_TEL + '"><span class="ic">📞</span><span class="t">Call Lance</span></a>' +
  '<a class="btn small contact" href="sms:' + PHONE_TEL + '"><span class="ic">💬</span><span class="t">Text Lance</span></a>' +
  '</div>';

document.getElementById('buttons').innerHTML = html;
</script>
</body>
</html>
